[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loralab"
version = "0.1.0"
description = "Catalog and mix YuE2 LoRA adapters against a GCS bucket, locally."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
# Needed only for the service-account / ADC rungs of the auth ladder.
# Without it the app falls back to `gcloud auth print-access-token`.
gcs = ["google-auth>=2.0", "requests>=2.25"]
dev = ["pytest>=7.0", "coverage>=7.0"]

[project.scripts]
loralab = "loralab.cli:main"

[tool.setuptools.packages.find]
include = ["loralab*"]

[tool.setuptools.package-data]
"loralab.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `coverage report` exits non-zero below the floor. Run it as:
#   python3 -m coverage run -m pytest -q && python3 -m coverage report
[tool.coverage.run]
branch = true
source = ["loralab"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]
